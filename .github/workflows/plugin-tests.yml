name: Plugin tests (perl)

# Helper.pm 存根回归 + 全模块语法检查（stub LMS 树）。
# 诊断采用独立 step：jobs API 的 step 粒度红绿即结果。
# H1/H2 切片由本地预生成并随仓库提交（避免 CI 内嵌脚本）。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install perl deps
        run: sudo apt-get update && sudo apt-get install -y libanyevent-perl libjson-xs-perl

      - name: Helper regression
        run: cd plugin && perl t/helper-test.pl

      - name: Build stub tree
        run: |
          cd plugin
          mkdir -p t_build/Plugins/LxMusic
          cp LxMusic/*.pm t_build/Plugins/LxMusic/
          cp ../t_diag/H1.pm ../t_diag/H3.pm ../t_diag/H4a0.pm ../t_diag/H4a1.pm ../t_diag/H4a2.pm ../t_diag/H4b.pm ../t_diag/H4c.pm ../t_diag/H5.pm t_build/Plugins/LxMusic/

      - name: DEPS all core modules loadable
        run: perl -MURI::Escape -MMIME::Base64 -MJSON::XS -MEncode -MHTML::Entities -MTime::HiRes -MPOSIX -e1

      - name: CHECK H1 header-only
        run: cd plugin && perl -I t -I t_build -c t_build/Plugins/LxMusic/H1.pm

      - name: CHECK H3 flags-and-url-subs
        run: cd plugin && perl -I t -I t_build -c t_build/Plugins/LxMusic/H3.pm

      - name: CHECK H4a0 empty-shell control
        run: cd plugin && perl -I t -I t_build -c t_build/Plugins/LxMusic/H4a0.pm

      - name: CHECK H4a1 scanUrl-prelude
        run: cd plugin && perl -I t -I t_build -c t_build/Plugins/LxMusic/H4a1.pm

      - name: CHECK H4a2 scanUrl-request-block
        run: cd plugin && perl -I t -I t_build -c t_build/Plugins/LxMusic/H4a2.pm

      - name: CHECK H4b new
        run: cd plugin && perl -I t -I t_build -c t_build/Plugins/LxMusic/H4b.pm

      - name: CHECK H4c explodePlaylist
        run: cd plugin && perl -I t -I t_build -c t_build/Plugins/LxMusic/H4c.pm

      - name: CHECK H5 metadata-subs
        run: cd plugin && perl -I t -I t_build -c t_build/Plugins/LxMusic/H5.pm

      - name: CHECK Helper.pm
        run: cd plugin && perl -I t -I t_build -c t_build/Plugins/LxMusic/Helper.pm

      - name: CHECK ProtocolHandler.pm
        run: cd plugin && perl -I t -I t_build -c t_build/Plugins/LxMusic/ProtocolHandler.pm

      - name: CHECK Plugin.pm
        run: cd plugin && perl -I t -I t_build -c t_build/Plugins/LxMusic/Plugin.pm
