name: Plugin tests (perl)

# Helper.pm 存根回归 + 全模块语法检查（stub LMS 树）。
# 回归日志由 CI 直接 commit 回仓库（日志 API 不可靠时的固定取证通道）。
#
# 2026-09-21 修：Helper regression 曾在裸 `perl t/helper-test.pl` 下恒失败
# （`Can't locate Plugins/LxMusic/Sources.pm in @INC`）——Helper.pm 会
# `use Plugins::LxMusic::Sources`，而 t/ 里没有 Plugins/ 映射。
# 现在两手都做：① 先建 stub 树并给 perl 传 `-I t -I t_build`；
# ② t/helper-test.pl 自己也挂了 @INC 钩子（未传 -I 也能独立跑通）。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install perl deps
        run: sudo apt-get update && sudo apt-get install -y libanyevent-perl libjson-xs-perl

      - name: DEPS all core modules loadable
        run: perl -MURI::Escape -MMIME::Base64 -MJSON::XS -MEncode -MHTML::Entities -MTime::HiRes -MPOSIX -e1

      - name: Build stub tree
        run: |
          cd plugin
          mkdir -p t_build/Plugins/LxMusic
          cp LxMusic/*.pm t_build/Plugins/LxMusic/

      - name: Helper regression
        run: |
          cd plugin
          set -o pipefail
          perl -I t -I t_build t/helper-test.pl 2>&1 | tee helper-test.log
          exit ${PIPESTATUS[0]}

      - name: Resolve parallel regression (0.11.24)
        run: |
          cd plugin
          set -o pipefail
          perl -I t -I t_build t/resolve-parallel-test.pl 2>&1 | tee -a helper-test.log
          exit ${PIPESTATUS[0]}

      # 0.11.49: no-self-trigger regression (the 3 LMS crashes of 2026-09-22).
      # Asserts that a simulated echo loop (every metadata write echoes a playlist
      # notification) causes ZERO writes, and that metadata-only notifications do
      # not even schedule a republish. ~12s (sleeps 1.05s between rounds).
      - name: Republish loop regression (0.11.49)
        run: |
          cd plugin
          set -o pipefail
          LX_TEST_QUIET_WARN=1 perl -I t -I t_build t/republish-loop-test.pl 2>&1 | tee -a helper-test.log
          exit ${PIPESTATUS[0]}

      # 0.11.72/0.11.75/0.11.76/0.11.81: cover tier (list 300 vs big 500), duration
      # fallback for the page-head "play all" gate, the method/function call
      # tolerance in coverThumbSize, and "non-ladder formats must not be relabelled"
      # in _actualTier (delivered Ogg Vorbis used to be reported as flac).
      - name: Cover tier + duration regression (0.11.72-0.11.81)
        run: |
          cd plugin
          set -o pipefail
          LX_TEST_QUIET_WARN=1 perl -I t -I t_build t/cover-tier-test.pl 2>&1 | tee -a helper-test.log
          exit ${PIPESTATUS[0]}

      # 0.11.78: songlist search pagination. The plugin used to show only 8 results
      # per platform from page 1 with a hard cap of 40 and no paging at all
      # (PC 2.12.6 served 963 rows over 19 pages for the same keyword while those
      # 33 rows were all on PC's first page). This suite pins the virtual-list
      # geometry, the "probe once, then top up only the missing [source,page]"
      # plan, and the shrink-on-short/failed-page rules.
      - name: Songlist search pagination regression (0.11.78)
        run: |
          cd plugin
          set -o pipefail
          LX_TEST_QUIET_WARN=1 perl -I t -I t_build t/pl-search-page-test.pl 2>&1 | tee -a helper-test.log
          exit ${PIPESTATUS[0]}

      # 0.11.83: board window filling. The page-head "play all" enumerates the whole
      # feed with one big window, and the handler used to keep pulling upstream pages
      # until the window was full -- without de-duplicating and without honouring the
      # upstream `total`. Sources whose board URL ignores `page` (mg always returns the
      # same page; wy returns the whole board every time) therefore had their first page
      # appended over and over: on the device mg's 100-song board queued 300 rows.
      - name: Board window filling regression (0.11.83)
        run: |
          cd plugin
          set -o pipefail
          LX_TEST_QUIET_WARN=1 perl -I t -I t_build t/board-window-test.pl 2>&1 | tee -a helper-test.log
          exit ${PIPESTATUS[0]}

      # 0.11.84 (A0 matrix): tier/bitrate label derivation, pinned to the *measured* cells
      # of the source x platform x tier matrix (tmp/label_matrix.py). A measured bit depth
      # (FLAC STREAMINFO) now outranks the upstream `types[]` declaration -- kw's "晴天"
      # really delivers 24bit/1647kbps while kw only declares up to flac, and the old cap
      # reported "FLAC" (below the truth). Non-ladder formats (OGG/APE/WAV) must never be
      # relabelled, and mp3 must land on the nearest measured bitrate tier.
      - name: Tier label derivation regression (0.11.84)
        run: |
          cd plugin
          set -o pipefail
          LX_TEST_QUIET_WARN=1 perl -I t -I t_build t/tier-label-test.pl 2>&1 | tee -a helper-test.log
          exit ${PIPESTATUS[0]}

      # 0.11.86 (CBM audit F.13): the resident-worker lifecycle. `request ->
      # _worker_submit -> _worker_poll(timeout) -> _worker_kill ->
      # _worker_fail_all('retry:...') -> request` is a FOUR-element cycle; its
      # termination rests on two invariants (the one-shot `forked` flag and the
      # 10-minute WORKER_BAD stamp) plus "kill only deletes its own slot" (the
      # 0.11.58 orphan-worker bug). Losing either one silently brings back the
      # 0.11.54 "worker stopped" avalanche.
      - name: Worker lifecycle regression (0.11.86)
        run: |
          cd plugin
          set -o pipefail
          LX_TEST_QUIET_WARN=1 perl -I t -I t_build t/worker-lifecycle-test.pl 2>&1 | tee -a helper-test.log
          exit ${PIPESTATUS[0]}

      # 0.11.86 (todo A-2): render-time COVER prewarm. List rows get the list-size
      # cover (300) and the skin fetches those itself, but the queue / now-playing
      # panel asks for the BIG variant (500 / kg `:big`) -- a different cache key,
      # i.e. a second resolution (kw pic.web GET, kg get_res_privilege POST) right
      # when the user hits play. warmCovers resolves the first N rows ahead of time.
      # The suite pins the tier choice, the cap/dedupe rules, all three off-switches,
      # "direct links need no prewarm", and that the prewarm key is byte-identical
      # to the key the real proxy path uses (a mismatch = silent no-op).
      - name: Cover prewarm regression (0.11.86)
        run: |
          cd plugin
          set -o pipefail
          LX_TEST_QUIET_WARN=1 perl -I t -I t_build t/cover-warm-test.pl 2>&1 | tee -a helper-test.log
          exit ${PIPESTATUS[0]}

      # 0.11.86 (todo B-4/B-5): songlist tree warming + the mg "lean detail" head blob.
      # B-4: entering a platform now fires the next layer in parallel (tags + page 1 of
      # the list) as `bg` requests that Helper drops when busy, writing into the SAME
      # caches the foreground path reads. B-5: mg's detail makes two upstream hops and
      # the second one (`resource/playlist/v2.0`, 2.2KB) costs 886~1354ms while only
      # supplying name/img/author/count -- data the list row already has. The row now
      # carries that blob down the drill-down link and mg skips that hop.
      - name: Songlist warm + detail head regression (0.11.86)
        run: |
          cd plugin
          set -o pipefail
          LX_TEST_QUIET_WARN=1 perl -I t -I t_build t/pl-warm-test.pl 2>&1 | tee -a helper-test.log
          exit ${PIPESTATUS[0]}
          LX_TEST_QUIET_WARN=1 perl -I t -I t_build t/pl-detail-head-test.pl 2>&1 | tee -a helper-test.log
          exit ${PIPESTATUS[0]}

      # 0.11.86 (todo C-7): queue-metadata write dedupe. Enqueueing a 300-row board
      # used to write ~900 times (cover write + title/secs write per row, then the +3s
      # tail republish wrote all 300 again). The content fingerprint now lives inside
      # publishQueueMetadata (shared with both republish paths) and the explode path
      # publishes cover+title+secs+kbps in ONE call -> 300 writes, and the tail
      # republish is a no-op. The suite also guards that a real change (bitrate /
      # cover) still writes, and that skipped rows keep their in-memory record.
      - name: Publish dedupe regression (0.11.86)
        run: |
          cd plugin
          set -o pipefail
          LX_TEST_QUIET_WARN=1 perl -I t -I t_build t/publish-dedupe-test.pl 2>&1 | tee -a helper-test.log
          exit ${PIPESTATUS[0]}

      # 0.11.91: metadata persistence. Daphile restarts used to wipe every queue-row
      # cover (our url->metadata map lived only in memory, and the republish paths are
      # triggered by playlist changes, which a restart never emits). The map is now
      # persisted (cover/title/secs/kbps/quality + audio attrs; NEVER the direct link,
      # which dies in 84s..13min) and read back at startup. This suite pins the
      # "bounded" requirement: TTL expiry, row cap, the 512KB size guard, queue rows
      # being exempt from both, the on/off switch really writing nothing, corrupt
      # files not crashing the plugin, and the getMetadataFor fallback to LMS's own
      # `remote_image_<url>` cache.
      - name: Metadata persistence regression (0.11.91)
        run: |
          cd plugin
          set -o pipefail
          LX_TEST_QUIET_WARN=1 perl -I t -I t_build t/meta-persist-test.pl 2>&1 | tee -a helper-test.log
          exit ${PIPESTATUS[0]}

      - name: URL query ASCII regression (0.11.97)
        # 中文 `n=` 会把 LMS 打崩（JSONRPC 连接被关闭、队列 0 行、行内播放按钮没反应）：
        # `n=` 经 uri_escape_utf8 本身是 ASCII，但走 XMLBrowser `anyurl?p2=` 时会被
        # 解回真中文，LMS 交给 updateOrCreate/URI->new 时 wide character 打崩请求。
        # 现在显示名走 musicInfo 的 `_title`（base64url 内），query 只留 s=/t=。
        # 本步钉死：带中文标题时 URL 整串纯 ASCII、query 无 n=、parseUrl 能读回、
        # 老 URL 的 n= 仍兼容。
        run: |
          cd plugin
          set -o pipefail
          LX_TEST_QUIET_WARN=1 perl -I t -I t_build t/url-query-ascii-test.pl 2>&1 | tee -a helper-test.log
          exit ${PIPESTATUS[0]}

      - name: CHECK Helper.pm
        run: cd plugin && perl -I t -I t_build -c t_build/Plugins/LxMusic/Helper.pm

      - name: CHECK ProtocolHandler.pm
        run: cd plugin && perl -I t -I t_build -c t_build/Plugins/LxMusic/ProtocolHandler.pm

      - name: CHECK Plugin.pm
        run: cd plugin && perl -I t -I t_build -c t_build/Plugins/LxMusic/Plugin.pm

      - name: CHECK Settings.pm / Sources.pm
        run: |
          cd plugin
          perl -I t -I t_build -c t_build/Plugins/LxMusic/Settings.pm
          perl -I t -I t_build -c t_build/Plugins/LxMusic/Sources.pm

      - name: Publish regression log back to repo
        if: always()
        run: |
          cd plugin
          git config user.email ci@localhost
          git config user.name ci-bot
          git add -f helper-test.log
          git commit -m "ci: regression log [skip ci]" || echo "no change"
          git push || echo "push skipped"
