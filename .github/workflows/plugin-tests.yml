name: Plugin tests (perl)

# Helper.pm 存根回归：协议解析 / 源安装 / 引擎复制与自检。
# ubuntu 原生 perl + LMS 同款依赖（AnyEvent、JSON::XS）。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install perl deps
        run: sudo apt-get update && sudo apt-get install -y libanyevent-perl libjson-xs-perl

      - name: Helper regression
        run: |
          cd plugin
          perl t/helper-test.pl

      - name: Syntax check all plugin modules (stub LMS tree)
        run: |
          cd plugin
          mkdir -p t_build/Plugins/LxMusic
          cp LxMusic/*.pm t_build/Plugins/LxMusic/
          for m in URI::Escape MIME::Base64 JSON::XS Encode HTML::Entities Time::HiRes POSIX; do
            perl -M"$m" -e1 2>&1 && echo "DEP OK: $m" || echo "DEP FAIL: $m"
          done
          perl -I t -I t_build -e 'print "s1\n"; require Slim::Utils::Log; print "s2\n"; require Slim::Music::Info; print "s3\n"; require Slim::Player::Protocols::HTTP; print "s4\n"; require Slim::Player::ProtocolHandlers; print "s5\n"; require Plugins::LxMusic::Helper; print "s6\n";' 2>&1 || echo "FAIL_SEQ rc=$?"
          perl -I t -I t_build -e 'print "p1\n"; require Slim::Player::Protocols::HTTP; print "p2\n"; use MIME::Base64 (); print "p3\n"; use URI::Escape (); print "p4\n"; use base qw(Slim::Player::Protocols::HTTP); print "p5-base\n";' 2>&1 || echo "FAIL_BASE rc=$?"
          perl -I t -I t_build -e 'use Plugins::LxMusic::ProtocolHandler; print "PROTO LOADED\n"' 2>&1 || echo "FAIL_PROTO_LOAD rc=$?"
          perl -I t -I t_build -e 'use Plugins::LxMusic::Plugin; print "PLUGIN LOADED\n"' 2>&1 || echo "FAIL_PLUGIN_LOAD rc=$?"
          perl -I t -I t_build -c t_build/Plugins/LxMusic/Helper.pm 2>&1 || echo "FAIL_HELPER rc=$?"
          perl -I t -I t_build -c t_build/Plugins/LxMusic/ProtocolHandler.pm 2>&1 || echo "FAIL_PROTO rc=$?"
          perl -I t -I t_build -c t_build/Plugins/LxMusic/Plugin.pm 2>&1 || echo "FAIL_PLUGIN rc=$?"
          echo "SYNTAX CHECK DONE"
