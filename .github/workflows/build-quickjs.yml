name: Build QuickJS (linux-x86_64)

# 自编译 bellard 原版 quickjs（自带 std/os 模块 + js_std_loop Promise 作业驱动）。
# 产物 qjs 静态二进制挂到本仓库 release（tag: qjs-v*），
# 由洛雪音乐插件打包流程下载放入 Bin/x86_64-linux/。
# 触发：手动 (workflow_dispatch) 或推 qjs-v* tag。

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'qjs-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this repo (shim + tests)
        uses: actions/checkout@v4

      - name: Clone upstream bellard/quickjs
        run: |
          git clone --depth 1 https://github.com/bellard/quickjs.git qjs-src
          cd qjs-src
          git rev-parse HEAD > ../upstream_commit.txt

      - name: Build qjs (static)
        run: |
          cd qjs-src
          make qjs LDFLAGS="-static" -j4
          strip qjs
          file qjs
          ./qjs -e "print('qjs ok, scriptArgs=' + typeof scriptArgs)"

      - name: Smoke test std/os modules
        run: |
          cd qjs-src
          ./qjs -e "import('std').then(m=>print('STD:', Object.keys(m).join(',')))"
          ./qjs -e "import('os').then(m=>print('OS:', Object.keys(m).join(',')))"

      - name: Shim regression (md5 / urlGet+redirect / Promise loop)
        run: |
          Q=qjs-src/qjs
          set -e
          OUT=$($Q engine/shim.mjs engine/test/test-source.js ping '{}')
          echo "$OUT"
          echo "$OUT" | grep -q '"pong":true'
          echo "$OUT" | grep -q '900150983cd24fb0d6963f7d28e17f72'
          echo "$OUT" | grep -q '"b64":"aGVsbG8="'
          echo "$OUT" | grep -q '"env":"desktop"'
          OUT2=$($Q engine/shim.mjs engine/test/test-source.js http '{}')
          echo "$OUT2"
          echo "$OUT2" | grep -q '"ok200":true'
          echo "SHIM REGRESSION OK"

      - name: Release binary (tag name = qjs-v*)
        if: startsWith(github.ref, 'refs/tags/qjs-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd qjs-src
          gh release create "$GITHUB_REF_NAME" qjs --title "$GITHUB_REF_NAME" --notes "Static qjs (bellard quickjs) for linux-x86_64. Built by CI from upstream commit $(cat ../upstream_commit.txt)." --repo "$GITHUB_REPOSITORY"
